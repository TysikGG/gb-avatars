name: Publish to npm

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: 'npm-publish'
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Run verification tests
        run: npm test

      - name: Build library (ESM, CJS, Types)
        run: npm run build:lib

      - name: Publish to npm if version bumped
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          NPM_VERSION=$(npm view gb-avatars version 2>/dev/null || echo "none")
          echo "Local version: $CURRENT_VERSION"
          echo "npm registry version: $NPM_VERSION"

          if [ "$CURRENT_VERSION" != "$NPM_VERSION" ]; then
            echo "Publishing version $CURRENT_VERSION to npm..."
            npm publish --access public
          else
            echo "Version $CURRENT_VERSION is already published on npm. Skipping publish."
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
